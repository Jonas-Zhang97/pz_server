# 设置为1000将会使所有被玩家击杀的僵尸身上拥有额外战利品。 最小值=0.10 最大值=100.00 默认=1.00
MoreTraits.GraveRobberChance=1.0

# 决定盗墓贼可以找到多少确定的额外战利品。
# 默认情况下，一个随机数值会被确定，增加这个数值会在计算时决定额外战利品。 最小值=0 最大值=10 默认=1
MoreTraits.GraveRobberGuaranteedLoot=1

# 该数值代表拥有拾荒者特质的玩家在任何容器中找到额外物品的概率。
# 100%将会使所有容器都拥有额外物品。 最小值=1 最大值=100 默认=20
MoreTraits.ScroungerChance=20

# 该数值代表拾荒者加倍任何容器中物品的可能性。
# 例如：拾荒者触发概率是指在任何容器中拥有潜在额外战利品的概率。
# 一个容器触发该初始检测后，一系列检测会进行：每个该容器中的物品都会进行一次计算，来确定其是否会被加倍。
# 若该数值被设置为100%，那么每当拾荒者被动触发时，整个容器中物品都会被加倍。
# 如果拾荒者触发概率和拾荒者物品概率都被设置为100%，那么拥有拾荒者特质的玩家将会在所有容器中发现所有物品都被加倍了。 最小值=1 最大值=100 默认=10
MoreTraits.ScroungerItemChance=10

# 该数值代表拥有拾荒者特质的玩家触发被动时找到物品的多少。
# 100%代表加倍找到的额外战利品。
# 额外物品的数值总会四舍五入，因此即使是一个物品也有概率会加倍。
# 该效果对例如香烟或弹药等物品时十分显著。 最小值=10 最大值=1000 默认=30
MoreTraits.ScroungerLootModifier=30

# 拥有不细致特质的玩家在任何容器中找到更少物品的概率。
