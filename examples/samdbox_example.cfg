# 减少该数值会导致保镖特质的过度强化。 最小值=1 最大值=240 默认=60
MoreTraits.BouncerCooldown=60

# （按照块大小）距离玩家多远，保镖特质将开始尝试推开敌人。
# 降低该数值意味着保镖特质会在离玩家更近的距离发挥作用。 最小值=0.25 最大值=5.00 默认=1.75
MoreTraits.BouncerDistance=1.75

# 拥有健身爱好者特质的玩家在健身时获得的额外体格/力量经验百分比。
