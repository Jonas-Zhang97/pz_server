GydeTraitMags.DaysBeforeRead=0

# 更改杂志出现的频率。有关更多信息，请参阅工作坊页面。 默认=默认
    -- 1 = 非常低
    -- 2 = 低
    -- 3 = 默认
    -- 4 = 高
    -- 5 = 非常高
GydeTraitMags.SpawnRate=3

# 禁用此选项以停止“超速狂魔”杂志在游戏中出现。
# 
# 特质描述：
# 装备切换速度提高200%，所有车辆最高速度提高115%。
GydeTraitMags.SpawnSpeedDemon=true

# 禁用此选项以停止“营养学家”杂志在游戏中出现。
# 
# 特质描述：
# 允许玩家查看任何食物的营养价值，即使是未包装的食物。
GydeTraitMags.SpawnNutritionist=true

# 禁用此选项以停止“井井有条”杂志在游戏中出现。
# 
# 特质描述：
# 所有容器的容量提高130%，包括箱子、橱柜和汽车。
GydeTraitMags.SpawnOrganized=true

# 禁用此选项以停止“户外专家”杂志在游戏中出现。
# 
# 特质描述：
# 有10%的几率感冒。在穿越树木时，有1%或1.25%的几率被划伤/割伤。用凿口木板在营火上生火更快。
GydeTraitMags.SpawnOutdoorsman=true

# 禁用此选项以停止“阅读神速”杂志在游戏中出现。
# 
# 特质描述：
# 阅读速度提高130%。
GydeTraitMags.SpawnFastReader=true

# 禁用此选项以停止“学习神速”杂志在游戏中出现。
# 
# 特质描述：
# 所有技能获得130%的经验值，除了力量和健身。
GydeTraitMags.SpawnFastLearner=true

# 禁用此选项以停止“巧手良工”杂志在游戏中出现。
# 
# 特质描述：
# 所有建筑增加100HP。
# 提高建造速度（~11%）。
GydeTraitMags.SpawnHandy=true

# 禁用此选项以停止“伐木工”杂志在游戏中出现。
# 
# 特质描述：
# 斧头挥动速度提高25%（战斗和砍树）。
GydeTraitMags.SpawnAxeMan=true

# 禁用此选项以停止“窃贼”杂志在游戏中出现。
# 
# 特质描述：
# 可以热接车辆，强行打开窗户时更不容易破坏锁。
GydeTraitMags.SpawnBurglar=true

# 禁用此选项以停止“身轻如燕”杂志在游戏中出现。
# 
# 特质描述：
# 脚步声的听觉范围减少60%。
# 奔跑或跃过低围栏、向僵尸扑去时有90%的几率绊倒。
GydeTraitMags.SpawnGraceful=true

# 禁用此选项以停止“眼疾手快”杂志在游戏中出现。
# 
# 特质描述：
# 转移物品时减少50%的时间。
GydeTraitMags.SpawnDextrous=true

# 禁用此选项以停止“毫不起眼”杂志在游戏中出现。
# 
# 特质描述：
# 被僵尸发现的几率减少50%。
GydeTraitMags.SpawnInconspicuous=true

# 禁用此选项以停止“听觉灵敏”杂志在游戏中出现。
# 
# 特质描述：
# 感知半径增加200%。从后面接近的僵尸将会更早被发现。
GydeTraitMags.SpawnKeenHearing=true

