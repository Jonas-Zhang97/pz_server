# 拥有快速工作特质的玩家在进行需时间操作时会有多少额外进度添加到操作中。
# 更高的数值会使需时间操作更快完成。
# 这是一个细粒度值，100转换为0.1在速度上的加成。 最小值=0 最大值=100 默认=50
MoreTraits.QuickWorkerScaler=50

# 进行需时间工作时需要花费多少额外时间。
# 更高的数值会使需时间工作进行的更缓慢。
# 设置一个高数值会使其做所有事情都尤为缓慢——尤其是读书。 最小值=0 最大值=100 默认=50
MoreTraits.SlowWorkerScaler=50

# 限制匠心独运所给予的配方数。
# 默认情况下，匠心独运会给玩家所有配方。
# 开启该选项可以让你限制匠心独运特质所学到的数量。
MoreTraits.IngenuitiveLimit=false

# 匠心独运所学习未知合成配方的比例。
# 会从所有可用配方中随机选取。 最小值=5 最大值=95 默认=50
MoreTraits.IngenuitiveLimitAmount=50

# Determines the damage boost received when certain conditions are met. Damage scales based on the following:
# 
# Tier 1 (Default 2.0x): Endurance < 25%, Fatigue > 80%, or Pain > 75.
# Tier 2 (Default 1.5x): Endurance < 50%, Fatigue > 70%, or Pain > 50.
# Tier 3 (Default 1.25x): Endurance < 75%, Fatigue > 60%, or Pain > 20.
# 
# If multiple conditions are met, only the highest tier applies. 最小值=0.00 最大值=10.00 默认=2.00
MoreTraits.UnwaveringDamageBoost=2.0

# 默认下，武术家将只在玩家无武器时造成伤害。
# 如果启用，玩家的推搡会造成伤害，即使是拿着武器的情况下。
# 如果禁用该选项，你仍可以在副手有东西时获益于武术家特质（例如手电筒、包之类）。仅会检查主手是否有装备。
MoreTraits.MartialWeapons=false

# 古代物品的稀有度。
# 该值代表计算时的概率为X分之一。
# 更高数值意味着更少掉率。 最小值=100 最大值=10000 默认=1500
MoreTraits.AntiqueChance=1500

# 如果开启，古董收藏家特质将可以从任何地方找到稀有物品，而不是只能在箱子和金属货架上找到。
MoreTraits.AntiqueAnywhere=false

# 选取放逐特质的玩家将仍会保有一个腰带。
# 在通常的游戏流程中，除非使用模组改动战利品表或者杀掉其他玩家，是极难获取腰带的。
MoreTraits.ForgivingDeprived=false

# 选取酗酒特质的玩家将不会死于酒精中毒，但是仍然会受周期性戒断反应困扰。
MoreTraits.NonlethalAlcoholic=false

# 需要多少天以使重振元气完成重新可用？ 最小值=1 最大值=30 默认=14
MoreTraits.SecondWindCooldown=14

# 硬汉特质应给予多少额外体力？ 最小值=5 最大值=50 默认=25
MoreTraits.HardyEndurance=25

# Minimum days that a Super Immune character takes to heal the sickness. 最小值=5 最大值=60 默认=10
MoreTraits.SuperImmuneMinDays=10

# Maximum days that a Super Immune character takes to heal the sickness. 最小值=5 最大值=60 默认=30
MoreTraits.SuperImmuneMaxDays=30

# If true, any infections after the first one was cured will only last half as long.
# Note: If caught multiple infections, it can still reach maximum days.
MoreTraits.SuperImmuneFirstInfectionBonus=true

# 如果开启该选项，在遭到数个感染的情况下超级免疫将无法保护你的身体。
MoreTraits.SuperImmuneWeakness=false

# If true, Super Immune is 6 times faster than normal.
# Preferably used in multiplayer games where you can't fast forward time.
MoreTraits.QuickSuperImmune=false

# 拥有免疫功能低下特质的玩家被僵尸攻击遭到感染的概率。
# 将该值设为100将会使所有僵尸攻击具有感染性。 最小值=0 最大值=100 默认=25
MoreTraits.ImmunoChance=25

# If true, Prowess: Guns will have a chance to not consume ammo. Not exactly lore-wise friendly, but fun.
MoreTraits.ProwessGunsAmmoRestore=true

# 如果你同时运行更多特质和拓展特质，它们都有修改携带重量的特质。
# 如果开启该选项，囤货者（来自拓展特质）和本mod中的携带重量特质（背包骡子/鼠）将会叠加。这意味着你从背包骡子/鼠得到的携带重量将会乘以1.25
# 如果关闭该选项，且你拥有两种特质（囤货者与背包骡子/鼠），它们哪个都有可能先运行，这意味着作者也不知道到底你的携带重量会被哪个特质计算。
MoreTraits.HoarderCompatibility=true

# Should players with Burn Ward be forbidden from starting fires?
MoreTraits.BurnedFireAversion=true

# Distance at which Burn Ward Patient gets activated by fire.
# Keep in mind, the higher this value is, the more panic and anxiety you will get from being close.
# Warning: Higher values might lead to FPS issues 最小值=5 最大值=50 默认=20
MoreTraits.BurnedDistance=20

# Panic you will get from Burn Ward Patient.<Br>Scaling works by repeatedly adding panic until max distance number is reached, starting from distance of closest fire.
# What this means is, if fire is 1 tile away and max is 20, it will give 20x panic than this number. This happens every one minute in-game. 最小值=1 最大值=10 默认=1
MoreTraits.BurnedPanic=1

# Stress you will get from Burn Ward Patient.<Br>Scaling works by repeatedly adding stress until max distance number is reached, starting from distance of closest fire.
# What this means is, if fire is 1 tile away and max is 20, it will give 20x stress than this number. This happens every one minute in-game. 最小值=1 最大值=10 默认=1
MoreTraits.BurnedStress=1

# Speed modifier applied when sprinting with the 'Fast' trait. 最小值=0.00 最大值=5.00 默认=0.75
MoreTraits.FastSprint=0.75

# Speed modifier applied when running with the 'Fast' trait. 最小值=0.00 最大值=5.00 默认=0.50
MoreTraits.FastRunning=0.5

# Speed modifier applied when walking with the 'Fast' trait. 最小值=0.00 最大值=5.00 默认=0.25
MoreTraits.FastWalking=0.25

# Speed reduction applied when sprinting with the 'Gimp' trait. 最小值=-5.00 最大值=0.00 默认=-0.25
MoreTraits.GimpSprint=-0.25

# Speed reduction applied when running with the 'Gimp' trait. 最小值=-5.00 最大值=0.00 默认=-0.50
MoreTraits.GimpRunning=-0.5

# Speed reduction applied when walking with the 'Gimp' trait. 最小值=-5.00 最大值=0.00 默认=-0.75
MoreTraits.GimpWalking=-0.75

