# 狗在成为你的同伴之前必须达到的信任值（通过喂食获得）。 最小值=1 最大值=1000 默认=100
CompanionDogs.TameThreshold=100

# 一名玩家可同时拥有的最大同伴犬数量。0 = 无限制。达到上限时，无法再驯服新的流浪狗（喂食选项变红）；放归或失去一只狗会空出一个名额。 最小值=0 最大值=30 默认=0
CompanionDogs.MaxCompanions=3

# 允许同伴犬攻击附近的僵尸。
CompanionDogs.CombatEnabled=true

# 缩放同伴犬对僵尸造成的伤害，在品种威力、技能等级和力量基因之上叠加。1.0 为校准后的默认值；更高则咬得更狠，0 则让撕咬毫无伤害。无论此值调多高，体弱的小卡流浪狗仍无法独自了结一只僵尸，这是刻意设计。 最小值=0.00 最大值=5.00 默认=1.00
CompanionDogs.DogDamageMultiplier=1.0

# 同伴需要照顾：喂食以控制饥饿、忠诚度和压力。被忽视的狗会不服从命令。
CompanionDogs.UpkeepEnabled=true

# 调整伙伴犬变饿和口渴的速度。1.0 是平衡后的默认值：吃饱的狗大约 3 天从饱腹变为饥饿，需要喝水的次数约为两倍。数值越高越需要照顾，越低则越省心。设为 0 会完全冻结饥饿与口渴，狗再也不需要进食或饮水。但忠诚度仍会下降，它依然需要你的关注。若想彻底关闭整个照料系统，请使用“需求与维持”。 最小值=0.00 最大值=5.00 默认=1.00
CompanionDogs.NeedsRateMultiplier=1.0

# 得到照顾的狗每个游戏日内损失的忠诚度点数（0-100）。当狗饥饿或口渴时，衰减速度会加快。 最小值=0.00 最大值=100.00 默认=12.00
CompanionDogs.LoyaltyDecayPerDay=12.0

# 狗是食肉动物，只填饱肚子还不够。若连续三天没有摄入蛋白质（肉、鱼、蛋或狗粮，手喂、从食盆中取用或自己猎到的都算），
# 狗就会变得虚弱：撕咬伤害减半，也会更频繁地无视命令。
# 蛋白质按份量抵扣计时：一块牛排或一袋狗粮能一次抵完整个计时，一小片培根只能抵掉几个小时，但零碎的量会累加。
# 当狗待在犬舍、被你抱着或在农场看护时，计时会暂停。计时的长短由“无蛋白质可撑的小时数”决定。
CompanionDogs.ProteinNeedEnabled=true

# 设定狗在变得虚弱前能撑多久不摄入蛋白质，以游戏内小时计。默认 72 小时，也就是三天。调低会让肉食变成每天的功课，调高则只需偶尔补一次。进食是按比例抵扣计时的，所以整体会一起伸缩：在 72 小时下，一块牛排或一袋狗粮仍然一次抵完，一小片培根大约抵掉三个半小时。关闭“狗需要蛋白质”时此项无效。 最小值=6 最大值=168 默认=72
CompanionDogs.ProteinHours=72

# 狗会监视广阔区域并警告你僵尸的存在：远处或少量时发出低声咆哮，近距离、大量或可见时大声吠叫。
CompanionDogs.SentinelEnabled=true

# 抚摸你的狗并与之同睡，会稍微缓解你的“无聊”和“不开心”情绪。抚摸也能让狗平静下来并小幅提升忠诚度。
CompanionDogs.BondingEnabled=true

# 在狗身边睡觉后，你醒来时会获得一段时间的“精神饱满”：一个温和的临时增益，缓解恐慌、压力、悲伤和无聊，并让你更慢感到疲惫。关闭即可停用。
CompanionDogs.RestedBuffEnabled=true

# 在狗身边醒来后，“精神饱满”增益持续多少游戏小时。默认为2。 最小值=0.50 最大值=24.00 默认=2.00
CompanionDogs.RestedBuffHours=2.0

# 每个品种都有自己的心情图标，只要一只喂饱且忠诚的狗在身边就会出现：好伙伴、勇气、灵敏嗅觉、温暖等等。关闭后，HUD 上的图标和它带来的加成都会消失。狗的状态心情图标（饥饿、口渴、生病、虚弱）和“精神饱满”不受影响。
CompanionDogs.BreedMoodlesEnabled=true

# 所有技能经验获取的全局倍率。1.0为正常；更高则训练更快。 最小值=0.10 最大值=10.00 默认=0.50
CompanionDogs.SkillXPRate=0.5

# 放牧的主开关。开启后，你可以指定一只狗来照看特定的动物围栏：它会留在围栏内，安抚牲畜（减少压力，从而降低奶量和羊毛产量），
# 并悄无声息地驱赶附近的僵尸，即使你不在场时也能独立工作。
CompanionDogs.FarmCareEnabled=true

# 由服从技能解锁的技巧树总开关：命令狗前往指定地点（等级 1）、引开丧尸（等级 3）、嗅出物品（等级 5），以及在你睡觉时取回它嗅到的物品（等级 10）。未解锁的技巧仍会显示在菜单中，方便你了解后续内容。
CompanionDogs.TricksEnabled=true

# 狗的大声吠叫（哨兵的大声警报）是真实的噪音，会吸引附近的僵尸（对称的成本）。低声咆哮从不吸引僵尸。关闭后吠叫不会吸引僵尸。
CompanionDogs.DogNoiseAttractsZombies=true

# 在游戏世界中，每只同伴犬的名字漂浮在头顶上方显示。
CompanionDogs.ShowNameTags=true

# 缩放流浪狗在世界中出现的频率（小卡流浪狗、金毛寻回犬和警局德国牧羊犬），并保持它们之间的相对稀有度。1.0 为正常频率；2.0 使所有狗的生成翻倍，0 则禁用。 最小值=0.00 最大值=5.00 默认=1.00
CompanionDogs.DogSpawnMultiplier=1.0

# 流浪狗、野狗和被放归的狗不会被杀死（无论是僵尸、你的攻击、车辆、饥饿还是火焰）。
# 默认关闭。开启后世界更温和，你遇到的流浪狗总能安全驯服。无论此项如何，同伴犬本就无敌。
CompanionDogs.WildDogsInvincible=false

# 多人服务器：玩家断线后，其狗会被安全地移出世界（状态和需求保留并冻结），重新连接时归还。
# 跟随中的当前狗会回到主人身边；停留/守卫中的狗和待命的狗会在该区域加载后回到原地。
# 默认开启；关闭后离线玩家的狗会留在世界中（无敌且原地不动）。
CompanionDogs.DespawnOnOwnerOffline=true

# Multiplies the saddlebag's cargo capacity. 0 makes it purely cosmetic. 最小值=0.00 最大值=5.00 默认=1.00
CompanionDogs.CargoCapacityMultiplier=1.0

# 允许同伴犬（同一主人的公犬与母犬）交配并生育幼犬。关闭后将隐藏繁殖操作。
CompanionDogs.BreedingEnabled=true

# 怀孕的母犬分娩前所需的游戏内天数。 最小值=1 最大值=60 默认=4
CompanionDogs.GestationDays=4

# 幼犬长成成犬所需的游戏内天数，期间保留羁绊、基因和技能。幼犬仅在玩家附近加载时成长；对幼犬使用“暂停成长”会覆盖此设置。 最小值=1 最大值=365 默认=90
CompanionDogs.MaturityDays=90

# 同一主人的相邻成年公犬与母犬每个游戏日自行受孕的百分比几率（按小时结算）。
