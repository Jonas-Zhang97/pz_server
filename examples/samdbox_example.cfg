# Turn OFF to make the mod completely dormant: no spawning, no recovery, no cabinet visual updates - while the mod stays loaded so your save (especially multiplayer) remains loadable. Use this instead of uninstalling on game 42.20.4+, which cannot cleanly uninstall mods with craftable furniture. Existing cabinets remain as plain containers. A relog may be needed after changing this mid-save.
PropaneExchangeCabinet.Enabled=true

# Chance that a propane exchange cabinet spawns at each eligible location (Fossoil/Gas2Go gas stations, Zippee's convenience stores). Rolled ONCE per station per save - a station that rolls empty stays empty on that save. 0 = never, 100 = always. 最小值=0 最大值=100 默认=50
PropaneExchangeCabinet.SpawnChance=50

# Upper limit on how many propane tanks a spawned cabinet is stocked with (actual count is random from 0 to this). 最小值=0 最大值=6 默认=6
PropaneExchangeCabinet.MaxTanks=6

# Relative weight for a tank being near-full (90%-100%). Weighted against the near-empty weight. Tanks are never in the 20%-90% range. 最小值=0 最大值=100 默认=55
PropaneExchangeCabinet.FillWeightFull=55

# Relative weight for a tank being near-empty (0%-20%). 最小值=0 最大值=100 默认=15
PropaneExchangeCabinet.FillWeightEmpty=15

# Chance that a stocked propane cabinet includes the recipe-teaching magazine (Welder Special Edition). 0 = never, 100 = always -- subject to the one-per-save limit below, if enabled. 最小值=0 最大值=100 默认=25
PropaneExchangeCabinet.MagazineChance=25

# If enabled, the magazine stops dropping after the first copy is found on this save (not per player -- see mod notes for the multiplayer caveat). If disabled, it can drop repeatedly at the chance above.
PropaneExchangeCabinet.MagazineOnePerSave=true

# If selected only weathered cabinets will spawn, existing cabinets are not affected.
PropaneExchangeCabinet.RemoveNewCabinets=false

# Enable this if you want the Proximity Inventory to work only on zombies
ProximityInventory.ZombieOnly=false

