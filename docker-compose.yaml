services:
  zomboid-server:
    image: ghcr.io/meshi-team/project-zomboid-server:latest
    container_name: zomboid-server
    ports:
      - 16261:16261/udp
      - 16262:16262/udp
    volumes:
      - ./data:/root/Zomboid # persist saves/configs/logs
      - ./workshop:/root/.local/share/Steam/steamapps/workshop # persist workshop mods
    environment:
      - SERVER_NAME=kraken_n_stir
      - ADMIN_PASSWORD=admin
      - PORT=16261
      - SERVER_MEMORY=4096m
      - ADMIN_USERNAME=admin
      - PVP=false
      - MAX_PLAYERS=5
      - PASSWORD=iamgay
      
      - SLEEP_ALLOWED=true
      - SLEEP_NEEDED=true

      # # Zombie settings
      # - ZOMBIES=5
