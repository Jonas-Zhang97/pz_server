      # - MEMORY=6
      # - SIGHT=5
      # - HEARING=5
      # - THUMP_ON_CONSTRUCTION=false
      # - ACTIVE_ONLY=2
      
      # # Loot settings
      # - FOOD_LOOT=5
      # - CANNED_FOOD_LOOT=5
      # - LITTERATURE_LOOT=5
      
      # # World settings
